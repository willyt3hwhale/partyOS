# partyOS: no public fallback DNS.
# The party LAN is offline. The resolver must be the one from the DHCP lease
# (the venue DNS) or the DNS= of a static IP. The compiled-in FallbackDNS list
# (Cloudflare, Google, Quad9) can only hide a missing venue DNS. An empty value
# clears that list.
[Resolve]
FallbackDNS=
