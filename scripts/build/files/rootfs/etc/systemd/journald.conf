# partyOS shutdown diagnostics: the journal is SNAPSHOTTED to the USB per boot (see
# partyos-journal-snapshot) so a shutdown hang or any intermittent reboot can be read back on
# the NEXT boot via `partyos-lastboot-log`. journald itself stays VOLATILE on this RAM OS
# (Storage=volatile -> the live journal lives in /run/log/journal, which the snapshot copies);
# we deliberately do NOT make journald persist to /var/log because the RAM machine-id changes
# every boot and a bind+restart never actually persisted (confirmed on hardware). Bounded so
# the live journal we copy is always small and the slow USB is never hammered.
[Journal]
Storage=volatile
Compress=yes
# Cap the live (/run) journal we snapshot so a long uptime can't bloat the copy or the stick.
RuntimeMaxUse=64M
RuntimeMaxFileSize=16M
# Keep a 64M ceiling on a persistent dir too, in case journald ever lands on /var/log.
SystemMaxUse=64M
SystemMaxFileSize=16M
