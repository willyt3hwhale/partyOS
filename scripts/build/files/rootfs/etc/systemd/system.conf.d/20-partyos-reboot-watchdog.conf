[Manager]
# PID 1 pets the HW watchdog every RuntimeWatchdogSec/2. If userspace wedges, the chip
# resets the box and it re-PXEs. The fast teardown handles the common shutdown hang.
# 90s avoids a reset during a load spike. Keep heartbeat/soft_margin (modprobe.d, 120s) >= this.
RuntimeWatchdogSec=90s
# Pin systemd to the iTCO node (present when iTCO_wdt loaded); harmless if it's softdog.
WatchdogDevice=/dev/watchdog0
# Once the final reboot phase IS reached, bound it too (tighter, kernel-armed at that point).
RebootWatchdogSec=60s
ShutdownWatchdogSec=60s
