# nowayout=1 - once armed the watchdog CANNOT be stopped by userspace, so a wedge that
# also kills the pet-loop still fires the reset. heartbeat/soft_margin bound the chip's own
# hardware timeout; they MUST be >= RuntimeWatchdogSec (90s, below) or the chip would fire
# before PID 1's next pet and spuriously reset a healthy box. Set to 120s for margin.
options iTCO_wdt nowayout=1 heartbeat=120
options softdog  nowayout=1 soft_margin=120
