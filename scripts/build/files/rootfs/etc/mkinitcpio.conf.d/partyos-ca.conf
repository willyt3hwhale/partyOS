# partyOS: bundle the pinned CA into the initramfs at /etc/partyos/ca.pem so
# archiso_pxe_http's copytoram sfs fetch (curl --cacert /etc/partyos/ca.pem, baked by
# build-custom-image.sh) can validate the HTTPS airootfs.sfs. The hook runs pre-rootfs,
# so the rootfs copy is not visible there - FILES= copies it in at the same path.
FILES+=(/etc/partyos/ca.pem)
