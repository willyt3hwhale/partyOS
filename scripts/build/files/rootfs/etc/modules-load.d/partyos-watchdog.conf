# Load a hardware watchdog so systemd's RuntimeWatchdogSec has a /dev/watchdog to arm.
# iTCO_wdt is the Intel TCO watchdog. The others are best-effort alternates;
# softdog is a software fallback so a rig without a HW watchdog still self-recovers from a
# userspace wedge. modules-load.d silently skips any module the kernel doesn't have.
iTCO_wdt
iTCO_vendor_support
softdog
